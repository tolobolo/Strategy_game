[package]
name = "parkour_game2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
rand = "0.9"
pathfinding = "4"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"

# Faster iteration: light optimisation for our code, full for dependencies.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
